name: Deploy (Cloudflare Workers)

# Independent hosting path from Phase 0 of docs/runbooks/00-exit-and-ownership.md.
# The build target is already Cloudflare (nitro `cloudflare-module` preset), so
# this workflow is the whole hosting story: GitHub is the source of truth,
# Cloudflare serves upsy.ma, and Lovable becomes one optional editor.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   — token with "Edit Cloudflare Workers" permission
#   CLOUDFLARE_ACCOUNT_ID
#   VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY / VITE_SUPABASE_PROJECT_ID
#   VITE_SITE_URL          — canonical origin, e.g. https://www.upsy.ma
# Optional: VITE_SENTRY_DSN, VITE_POSTHOG_KEY, VITE_POSTHOG_HOST
#
# Server-only secrets (SUPABASE_SERVICE_ROLE_KEY, RESEND_API_KEY, …) are set on
# the Worker itself with `wrangler secret put`, never in this file.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Deploy target
        type: choice
        options: [production, preview]
        default: preview

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Fails before any Cloudflare call if the env contract or routing config
      # drifted — a bad deploy is far more expensive than a failed job.
      - name: Deploy config gate
        run: node scripts/check-deploy-config.mjs

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          VITE_APP_VERSION: ${{ github.sha }}
        run: npm run build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ github.event.inputs.environment }}" = "preview" ]; then
            npm run deploy:preview
          else
            npm run deploy
          fi

      # A deploy that returns 200 on "/" but 500 on an SSR route is the failure
      # mode this catches; the workflow should go red, not the users' browsers.
      - name: Smoke test
        if: ${{ github.event.inputs.environment != 'preview' }}
        env:
          PROD_URL: ${{ secrets.VITE_SITE_URL }}
        run: node scripts/check-production.mjs
