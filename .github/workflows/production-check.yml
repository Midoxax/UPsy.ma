name: Production check

# Verifies the deployed site, not the build output.
#
# Everything in ci.yml inspects dist/. Nothing proved that what a visitor
# receives matches it — and the two can differ completely. `vercel.json`
# headers only exist if Vercel reads that file; Deployment Protection can hide
# the whole site behind an auth wall that the owner, already logged in, never
# sees. This runs unauthenticated from a runner with real egress, which is the
# vantage point of an actual user.
#
# Replaces the previous smoke test, which curled six URLs for a 200 and would
# have passed happily against a site serving no security headers at all.

on:
  # Fires after a production deploy so a broken release is caught in minutes.
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to verify (defaults to the production alias in package.json)"
        required: false
        type: string
  schedule:
    # Daily. Catches drift from dashboard changes made outside the repo —
    # a toggled protection setting leaves no commit behind.
    - cron: "0 6 * * *"

jobs:
  verify:
    # Only production deployments, and only successful ones.
    #
    # deployment_status also fires for preview deploys, and Vercel protects
    # previews by default — so without the environment filter this gate would
    # fail on every pull request forever, for a reason that is correct
    # behaviour rather than a defect. A gate that is always red is a gate
    # everyone learns to ignore.
    if: >
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          check-latest: false

      - name: Resolve target URL
        id: target
        env:
          # Order matters, and the default is committed on purpose.
          #
          # deployment_status.target_url is a per-deployment address
          # (upsy-<hash>-<team>.vercel.app). Vercel treats those differently
          # from the production alias: disabling Deployment Protection makes
          # the alias public while per-deployment URLs can stay behind SSO. So
          # checking target_url reports an auth wall no real visitor meets — a
          # false alarm on the one signal this job exists to give. It stays as
          # a last resort rather than a preference.
          #
          # The alias itself comes from package.json, not solely from a repo
          # variable. This job previously hard-failed when vars.PROD_URL was
          # unset, which meant the entire production check — the only thing
          # that verifies the CSP and HSTS in vercel.json are actually served —
          # was disabled by a dashboard field nobody had filled in. A gate that
          # needs out-of-band setup before it can run is a gate that does not
          # run. vars.PROD_URL still wins when set, so the URL can be changed
          # without a commit.
          MANUAL_URL: ${{ inputs.url }}
          PROD_ALIAS: ${{ vars.PROD_URL }}
          DEPLOY_URL: ${{ github.event.deployment_status.target_url }}
        run: |
          COMMITTED="$(node -p "require('./package.json').homepage || ''")"
          URL="${MANUAL_URL:-${PROD_ALIAS:-${COMMITTED:-$DEPLOY_URL}}}"
          if [ -z "$URL" ]; then
            echo "::error::No target. Set \"homepage\" in package.json, or the PROD_URL repository variable, or pass a url via workflow_dispatch."
            exit 1
          fi
          case "$URL" in
            *-*-*.vercel.app)
              echo "::warning::Verifying a per-deployment URL ($URL). These can stay behind Deployment Protection even when the production alias is public. Set \"homepage\" in package.json or the PROD_URL variable to the alias for an accurate result." ;;
          esac
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Verifying $URL"

      - name: Verify production
        env:
          PROD_URL: ${{ steps.target.outputs.url }}
        run: node scripts/check-production.mjs

      # Needs egress to *.supabase.co, so it lives here rather than in ci.yml
      # where a sandboxed runner would skip it every time. Answers the question
      # the offline schema check cannot: whether a committed migration is
      # actually in the database, or whether the types are merely stale.
      # Reads no rows — it selects zero and asks only whether the relation
      # resolves.
      - name: Verify migrations reached the database
        run: node scripts/check-database.mjs

      # Only worth installing a browser if the site is reachable and public.
      - name: Install browser
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save playwright @axe-core/playwright --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Accessibility audit against production
        env:
          BASE: ${{ steps.target.outputs.url }}
        run: node tests/audit/run.mjs
