    <!-- Theme, applied before first paint.
         React cannot do this: its first commit happens after the browser has
         already painted, so a dark-mode visitor would see a white flash on
         every cold load. This runs synchronously in <head> instead.
         Must stay in sync with src/contexts/ThemeContext.tsx (same storage
         key, same resolution order). -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('u-psy-theme-v2');
          var pref = saved === 'light' || saved === 'dark' || saved === 'system' ? saved : 'system';
          var dark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          /* storage blocked — fall back to the light default in CSS */
        }
      })();
    </script>
